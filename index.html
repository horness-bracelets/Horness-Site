@media(prefers-color-scheme:dark){:root{--bg:#141414;--ink:#f1efe9;--mute:#9a9d99;--acc:#cfd9da;--on:#141414;--line:#2c2c2a;--soft:#1b1b1a;--stage1:#0c0c0b;--stage2:#000000;--logo:#f1efe9}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'Inter',system-ui,sans-serif}
body.cfg{padding-bottom:calc(94px + env(safe-area-inset-bottom,0px))}
.announce{background:#fff;color:#000;text-align:center;font:700 .76rem/1.4 'Inter',sans-serif;letter-spacing:.03em;padding:10px 16px;padding-top:calc(env(safe-area-inset-top,0px) + 10px);border-bottom:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.brand{position:relative;text-align:center;padding:16px 60px 12px}
.logo{display:block;margin:0 auto;aspect-ratio:560/440;background:var(--logo);-webkit-mask-image:var(--logo-img);mask-image:var(--logo-img);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain}
.brand .logo{width:104px}
.cornerbtn{position:absolute;top:18px;font:600 .68rem 'Inter',sans-serif;letter-spacing:.04em;color:var(--mute);background:none;border:1px solid var(--line);border-radius:10px;padding:5px 9px;display:flex;align-items:center;gap:4px}
.langbtn{right:16px}
.cartbtn{left:16px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--acc);color:var(--on);font-size:.62rem;font-weight:700}
.stage{position:sticky;top:0;z-index:2;background:radial-gradient(120% 100% at 50% 0%,var(--stage1),var(--stage2))}
.stage svg{display:block;width:100%;height:30vh;min-height:190px;max-height:260px}
#viewCfg main{max-width:560px;margin:0 auto;padding:0 18px}
#viewCfg section{padding:18px 0;border-bottom:1px solid var(--line)}
#viewCfg section:last-child{border:0}
#viewCfg h2{display:flex;justify-content:space-between;align-items:baseline;font:600 .95rem/1.3 'Inter',sans-serif;margin:0 0 10px}
#viewCfg h2 span{font-weight:400;font-size:.85rem;color:var(--mute)}
details.wrist{border:1px solid var(--line);border-radius:14px;padding:0 16px}
details.wrist summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 0;font:600 .92rem 'Inter',sans-serif}
details.wrist summary::-webkit-details-marker{display:none}
details.wrist summary span.v{color:var(--mute);font-weight:500}
details.wrist summary::after{content:"+";margin-left:10px;color:var(--mute);font-size:1.05rem}
details.wrist[open] summary::after{content:"–"}
.wrist-body{display:flex;align-items:center;justify-content:center;gap:22px;padding:4px 0 16px}
.stepbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:none;font:600 1.15rem 'Inter',sans-serif;color:var(--ink);line-height:1}
.wrist-val{font:600 1.35rem/1 'Cormorant Garamond',Georgia,serif;min-width:66px;text-align:center}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tab{flex:1;font:600 .88rem 'Inter',sans-serif;text-align:center;padding:10px 6px;border-radius:12px;border:1.5px solid var(--line);background:none;color:var(--ink)}
.tab small{font-weight:500;color:inherit;opacity:.75}
.tab.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;font:500 .8rem 'Inter',sans-serif;border:1px solid var(--line);background:none;color:var(--mute);border-radius:20px;padding:6px 12px;white-space:nowrap}
.fchip.on{border-color:var(--acc);color:var(--acc);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:14px 6px;margin-top:12px}
.swatch{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;color:var(--mute);font:500 .66rem/1.1 'Inter',sans-serif;padding:0}
.dot{position:relative;width:30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,.18);background-size:cover;background-position:center;box-shadow:inset -3px -3px 5px rgba(255,255,255,.5),inset 3px 3px 6px rgba(0,0,0,.1)}
.dot.s{box-shadow:inset -4px -4px 6px rgba(255,255,255,.85),inset 3px 3px 6px rgba(0,0,0,.28)}
.dot.m{box-shadow:inset -1px -1px 3px rgba(255,255,255,.22),inset 2px 2px 4px rgba(0,0,0,.13)}
.dot.c{border-style:dashed;opacity:.72}
.dot.rb{width:42px;height:29px;border-radius:50%}
.swatch span{letter-spacing:.01em}
.strand{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;min-height:30px;-webkit-overflow-scrolling:touch}
.strand::-webkit-scrollbar{display:none}
.bead-chip{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.22);background-size:cover;background-position:center}
.bead-chip.rb{width:30px;height:21px}
.empty-note{color:var(--mute);font:italic 500 .86rem/1.5 'Cormorant Garamond',Georgia,serif;text-align:center;max-width:320px;margin:4px auto 0}
.clearbtn{display:block;margin:8px auto 0;font:500 .78rem 'Inter',sans-serif;color:var(--mute);background:none;border:0;padding:4px 0;text-decoration:underline}
.hint{margin:6px 0 0;font-size:.8rem;color:var(--mute);text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:center;gap:16px;background:var(--bg);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.bar div{flex:1}
.bar small{display:block;font-size:.8rem;color:var(--mute)}
#pr{font:600 1.4rem 'Cormorant Garamond',Georgia,serif}
#addCartBtn{font:inherit;font-weight:600;color:var(--on);background:var(--acc);border:0;border-radius:12px;padding:13px 18px}
#addCartBtn:disabled{opacity:.4}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(10,14,15,.5);z-index:10;align-items:flex-end}
.modal-backdrop.open{display:flex}
.modal{background:var(--bg);width:100%;max-height:86vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:560px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-head h3{font:600 1.15rem 'Cormorant Garamond',Georgia,serif;margin:0}
.modal-close{font:400 1.3rem 'Inter',sans-serif;color:var(--mute);background:none;border:0;line-height:1;padding:2px 6px}
.cartline{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cl-dots{grid-row:1/3}
.cl-meta{font-size:.8rem;color:var(--mute)}
.cl-qty{display:flex;align-items:center;gap:8px}
.cl-qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:none;font:600 .9rem 'Inter',sans-serif}
.cl-price{grid-column:2;font:600 .88rem 'Inter',sans-serif}
.cl-remove{grid-row:1/3;color:var(--mute);background:none;border:0;font:400 1.1rem 'Inter',sans-serif}
.cart-empty{color:var(--mute);font:italic 500 .9rem 'Cormorant Garamond',Georgia,serif;text-align:center;padding:20px 0}
.cart-total{display:flex;justify-content:space-between;align-items:center;font:600 1.1rem 'Cormorant Garamond',Georgia,serif;padding:10px 0}
#checkoutBtn,#confirmOrderBtn{display:block;width:100%;font:inherit;font-weight:600;color:var(--on);background:var(--acc);border:0;border-radius:12px;padding:14px;margin-top:6px}
#checkoutBtn:disabled,#confirmOrderBtn:disabled{opacity:.4}
.field{margin-top:14px}
.field label{display:block;font:600 .8rem 'Inter',sans-serif;margin-bottom:6px}
.field input,.field textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--ink);resize:vertical}

body.home .brand{padding:22px 60px 18px}
body.home .brand .logo{width:150px}
#viewHome,#viewBest{line-height:1.6}
#viewHome .wrap,#viewBest .wrap{max-width:980px;margin:0 auto;padding:0 18px}
.banner{border-radius:0;overflow:hidden;aspect-ratio:21/10;background:var(--soft)}
.banner img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 61%}
.hero-copy{text-align:center;max-width:560px;margin:0 auto;padding:26px 0 6px}
.hero-copy h1{font:600 2.3rem/1.08 'Cormorant Garamond',Georgia,serif;letter-spacing:.01em;margin:0 0 14px}
.lead{margin:0 0 22px;font-size:1.02rem}
.cta{display:inline-flex;align-items:center;gap:10px;background:var(--acc);color:var(--on);text-decoration:none;font:600 .95rem 'Inter',sans-serif;letter-spacing:.04em;padding:16px 30px;border-radius:999px;box-shadow:0 10px 22px -10px rgba(28,51,59,.6);transition:transform .2s ease,box-shadow .2s ease}
.cta:hover{transform:translateY(-2px);box-shadow:0 14px 26px -10px rgba(28,51,59,.65)}
.cta .arr{transition:transform .2s ease}
.cta:hover .arr{transform:translateX(3px)}
.sub{margin:20px auto 0;max-width:400px;color:var(--mute);font-size:.8rem;line-height:1.55}
.facts{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:10px;margin:38px 0 8px}
.fact{border:1px solid var(--line);border-radius:16px;padding:16px 6px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0}
.fact b{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:min(1.25rem,4vw);line-height:1.15;white-space:nowrap}
.fact span{font-size:min(.76rem,2.8vw);color:var(--mute);line-height:1.3;white-space:nowrap}
.why{text-align:center;max-width:540px;margin:0 auto;padding:38px 0 18px}
h2.t{font:600 1.5rem/1.2 'Cormorant Garamond',Georgia,serif;margin:0 0 12px}
.why p{margin:0;color:var(--mute)}
.faq{max-width:640px;margin:0 auto;padding:18px 0 8px}
.faq h2.t{text-align:center;margin-bottom:16px}
details.acc{border:1px solid var(--line);border-radius:14px;padding:0 18px;margin-bottom:10px}
details.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:15px 0;font:600 .94rem 'Inter',sans-serif}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";color:var(--mute);font-size:1.1rem;margin-left:10px}
details.acc[open] summary::after{content:"–"}
.acc-body{padding:0 0 16px;color:var(--mute);font-size:.9rem}
.acc-body p{margin:0 0 8px}
.acc-body h3{font:600 .8rem 'Inter',sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);margin:14px 0 6px}
.acc-body ul{margin:0;padding-left:18px}
.acc-body li{margin-bottom:4px}
.follow{text-align:center;max-width:520px;margin:0 auto;padding:30px 0 10px}
.follow p{margin:0 0 18px;color:var(--mute)}
.social{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.social a{color:var(--ink);text-decoration:none;font:600 .86rem 'Inter',sans-serif;border:1px solid var(--line);border-radius:999px;padding:10px 22px;transition:border-color .2s}
.social a:hover{border-color:var(--acc)}
.handle{margin-top:12px;font-size:.78rem;color:var(--mute);letter-spacing:.03em}
footer{text-align:center;color:var(--mute);font-size:.78rem;padding:34px 18px calc(30px + env(safe-area-inset-bottom,0px))}
@media(min-width:720px){
 .banner{aspect-ratio:21/9}
 .hero-copy h1{font-size:3rem}
 body.home .brand .logo{width:176px}
 .fact{padding:22px 12px}
 .fact b{font-size:1.5rem}.fact span{font-size:.85rem}
}

.cta.ghost{background:none;color:var(--ink);border:1.5px solid var(--acc);box-shadow:none}
.cta.ghost:hover{background:var(--acc);color:var(--on);box-shadow:none}
.best-teaser{text-align:center;max-width:540px;margin:0 auto;padding:38px 0 8px}
.best-teaser p{margin:0 0 20px;color:var(--mute)}
.best-head{text-align:center;max-width:560px;margin:0 auto;padding:30px 0 24px}
.best-head h1{font:600 2.3rem/1.08 'Cormorant Garamond',Georgia,serif;margin:0 0 10px}
.best-head p{margin:0;color:var(--mute);font-size:.94rem}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px 12px}
.pcard{min-width:0}
.pimg{position:relative;aspect-ratio:1/1;background:var(--soft);overflow:hidden}
.pimg img{display:block;width:100%;height:100%;object-fit:cover}
.pimg .ph{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:46%;aspect-ratio:560/440;background:var(--logo);opacity:.1;-webkit-mask-image:var(--logo-img);mask-image:var(--logo-img);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain}
.padd{position:absolute;right:10px;bottom:10px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:0;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.padd:hover,.padd.done{background:var(--acc);color:var(--on);border-color:var(--acc)}
.pinfo{padding:10px 2px 0}
.pname{font:600 .88rem/1.3 'Inter',sans-serif}
.pprice{font-size:.84rem;color:var(--mute);margin-top:2px}
.best-build{text-align:center;max-width:520px;margin:0 auto;padding:46px 0 10px}
.cl-thumb{width:46px;height:46px;background:var(--soft) center/cover no-repeat}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:9;background:var(--acc);color:var(--on);display:flex;align-items:center;gap:16px;padding:12px 18px;border-radius:10px;font:500 .84rem 'Inter',sans-serif;white-space:nowrap;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:inherit;font:600 .84rem 'Inter',sans-serif;text-decoration:underline;padding:0}
@media(min-width:720px){
 .pgrid{grid-template-columns:repeat(3,1fr);gap:30px 16px}
 .best-head h1{font-size:3rem}
}

.cta-row{display:flex;flex-direction:column;align-items:center;gap:12px}
.cta-row .cta{width:100%;max-width:330px;justify-content:center}
.cornerbtn svg{display:block;flex:none}
.info-strip{background:var(--soft);border-bottom:1px solid var(--line)}
.info-strip details.info{max-width:560px;margin:0 auto;padding:0 18px}
.info-strip summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:11px 0;font:600 .8rem 'Inter',sans-serif;color:var(--ink)}
.info-strip summary::-webkit-details-marker{display:none}
.info-strip summary svg{color:var(--mute);flex:none}
.info-strip summary span{flex:1}
.info-strip summary::after{content:"+";color:var(--mute);font-size:1.05rem;line-height:1}
.info-strip details[open] summary::after{content:"–"}
.info-body{padding:0 0 14px}
.info-body p{margin:0 0 12px;color:var(--mute);font-size:.84rem;line-height:1.55}
details.acc.sm{padding:0 14px;margin-bottom:8px;background:var(--bg)}
details.acc.sm summary{padding:11px 0;font-size:.84rem}
.info-body .acc-body{font-size:.82rem;padding-bottom:12px}
@media(min-width:720px){
 .cta-row{flex-direction:row;justify-content:center;gap:14px}
 .cta-row .cta{width:auto;min-width:250px}
}
.faq-title{font:600 1.1rem/1.2 'Cormorant Garamond',Georgia,serif;color:var(--mute);text-align:center;margin:0 0 14px;letter-spacing:.02em}
.modal-backdrop.center{align-items:center;justify-content:center;padding:18px}
.modal.sm{border-radius:16px;max-width:340px;padding:18px 20px 20px;margin:0}
.wm-prod{margin:0;text-align:center;color:var(--mute);font-size:.86rem}
.wm-add{display:block;width:100%;font:inherit;font-weight:600;color:var(--on);background:var(--acc);border:0;border-radius:12px;padding:14px;margin-top:12px}
</style>

 return "en";
}

function hueOf(hex){
 const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
 const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min,l=(max+min)/2;
 if(d<0.06)return 1000+l*100;
 let h;
 if(max===r)h=((g-b)/d+6)%6;else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;
 return h*60;
}

const ROC_W=PAL.rocaille.r*1.9, ROC_H=PAL.rocaille.r*1.3, SEED_R=PAL.seed.r;
function beadMarkup(b,x,y,ang){
 const r=PAL[b.size].r;
 const clear=b.fx==="c",shiny=b.fx==="s",matte=b.fx==="m";
 if(b.size==="rocaille"){
  const w=ROC_W,h=ROC_H;
  const rot=(ang*180/Math.PI+90).toFixed(1);
  let body;
  if(b.img){
   body=`<image href="${b.img}" x="${(-w/2).toFixed(1)}" y="${(-h/2).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" clip-path="url(#clipRoc)" preserveAspectRatio="xMidYMid slice"/>`
    +`<rect x="${(-w/2).toFixed(1)}" y="${(-h/2).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${(h/2).toFixed(1)}" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="0.6"/>`;
  }else{
   const hlOp=shiny?0.88:matte?0.22:0.5;
   const hlR=(shiny?h*0.32:matte?h*0.14:h*0.22).toFixed(1);
   body=`<rect x="${(-w/2).toFixed(1)}" y="${(-h/2).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${(h/2).toFixed(1)}" fill="${b.h}" fill-opacity="${clear?0.45:1}" stroke="rgba(255,255,255,.3)" stroke-width="0.6"${clear?' stroke-dasharray="2 1"':''}/>`
    +`<ellipse cx="${(-w*0.18).toFixed(1)}" cy="${(-h*0.22).toFixed(1)}" rx="${hlR}" ry="${(hlR*0.6).toFixed(1)}" fill="rgba(255,255,255,${hlOp})"/>`;
  }
  return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot})">`+body+`</g>`;
 }
 if(b.img){
  return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})">`
   +`<image href="${b.img}" x="${-r}" y="${-r}" width="${2*r}" height="${2*r}" clip-path="url(#clipSeed)" preserveAspectRatio="xMidYMid slice"/>`
   +`<circle r="${r}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="0.7"/>`
   +`</g>`;
 }
 const hlOp=shiny?0.85:matte?0.25:0.55;
 const hl=(shiny?r*0.42:matte?r*0.18:r*0.28).toFixed(1);
 return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${b.h}" fill-opacity="${clear?0.45:1}" stroke="rgba(255,255,255,.35)" stroke-width="0.7"${clear?' stroke-dasharray="2 1"':''}/>`
  +`<circle cx="${(x-r*0.32).toFixed(1)}" cy="${(y-r*0.32).toFixed(1)}" r="${hl}" fill="rgba(255,255,255,${hlOp})"/>`;
}
function renderPreview(){
 const cx=150,cy=112;
 const beads=S.beads;
 const defs=`<defs><clipPath id="clipRoc" clipPathUnits="userSpaceOnUse"><rect x="${(-ROC_W/2).toFixed(1)}" y="${(-ROC_H/2).toFixed(1)}" width="${ROC_W.toFixed(1)}" height="${ROC_H.toFixed(1)}" rx="${(ROC_H/2).toFixed(1)}"/></clipPath><clipPath id="clipSeed" clipPathUnits="userSpaceOnUse"><circle r="${SEED_R}"/></clipPath></defs>`;
 if(!beads.length){
  $("pv").innerHTML=defs+`<circle cx="${cx}" cy="${cy}" r="55" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
   <text x="${cx}" y="${cy+5}" text-anchor="middle" fill="rgba(255,255,255,.55)" font-size="11" font-family="Inter,sans-serif">${t().previewEmpty}</text>`;
  return;
 }
 const dia=beads.map(b=>b.size==="rocaille"?ROC_W:2*SEED_R);
 const total=dia.reduce((a,c)=>a+c,0);
 const radius=Math.min(105,Math.max(40,total/(2*Math.PI)));
 let cum=0,g=defs+`<circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="2"/>`;
 beads.forEach((b,i)=>{
  const ang=(cum+dia[i]/2)/radius-Math.PI/2;
  cum+=dia[i];
  const x=cx+radius*Math.cos(ang), y=cy+radius*Math.sin(ang);
  g+=beadMarkup(b,x,y,ang);
 });
 $("pv").innerHTML=g;
}

function makeOrderNo(){
 const d=new Date(),p=n=>String(n).padStart(2,"0"),A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

// variables for the (English) EmailJS template, read from the current cart
function buildEmailJsParams(orderNo,name,email){
 const money=n=>n.toFixed(2)+" €";
 const small='color:#666;font-size:13px';
 const rows=CART.map(line=>{
  const sub=line.qty*(line.price||PRICE);
  if(line.product){
   const p=prodById(line.product);
   return `<div style="margin:0 0 12px"><b>${line.qty} × ${p?p.name.en:line.product}</b> — ${money(sub)}<br><span style="${small}">Wrist size: ${line.wrist} cm</span></div>`;
  }
  const beads=line.beads.map(b=>`${b.size==="rocaille"?"Rocaille":"Seed Bead"} ${NAMES.en[b.key]}`).join(", ");
  return `<div style="margin:0 0 12px"><b>${line.qty} × Custom bracelet</b> — ${money(sub)}<br><span style="${small}">Wrist size: ${line.wrist} cm<br>Beads: ${beads}</span></div>`;
 });
 // warenkorb_details is HTML (use {{{warenkorb_details}}} in the template); gesamtpreis is a plain number, the template adds the € sign
 return {bestellnummer:orderNo,kunde_name:name,kunde_email:email,warenkorb_details:rows.join(""),gesamtpreis:cartTotal().toFixed(2)};
}
// customer confirmation via EmailJS: never blocks the order itself.
// If it fails, the shop gets an extra mail with the exact reason so the customer can be contacted manually.
function notifyShopConfirmationFailed(params,reason){
 try{
  fetch(FORMSPREE_ENDPOINT,{
   method:"POST",headers:{"Accept":"application/json","Content-Type":"application/json"},
   body:JSON.stringify({
    email:params.kunde_email,
    _subject:"ACTION NEEDED: confirmation email NOT sent - "+params.bestellnummer,
    message:"The automatic confirmation email to the customer could not be sent. Please email the customer manually.\n\nOrder no.: "+params.bestellnummer+"\nCustomer: "+params.kunde_name+" <"+params.kunde_email+">\nTotal: "+params.gesamtpreis+" EUR\n\nEmailJS error: "+reason
   })
  }).catch(()=>{});
 }catch(e){}
}
function sendCustomerConfirmation(params){
 return new Promise(resolve=>{
  let done=false;
  const finish=(ok,reason)=>{
   if(done)return;done=true;clearTimeout(timer);
   if(!ok){console.warn("EmailJS:",reason);notifyShopConfirmationFailed(params,reason);}
   resolve(ok);
  };
  const timer=setTimeout(()=>finish(false,"timeout after 12 s"),12000);
  try{
   fetch("https://api.emailjs.com/api/v1.0/email/send",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({service_id:EMAILJS_SERVICE_ID,template_id:EMAILJS_TEMPLATE_ID,user_id:EMAILJS_PUBLIC_KEY,template_params:params})
   }).then(r=>r.ok?finish(true):r.text().then(msg=>finish(false,"HTTP "+r.status+": "+msg)))
     .catch(e=>finish(false,String((e&&e.message)||e)));
  }catch(e){finish(false,String((e&&e.message)||e));}
 });
}
function buildOrderText(name,email,addr,orderNo){
 const lines=[t().mailOrderNo(orderNo),t().mailIntro(cartCount()),""];
 let bn=0;
 CART.forEach(line=>{
  if(line.product){
   lines.push(h().mailProduct(prodName(line.product),line.qty,line.wrist));
   lines.push(t().mailSub(line.qty*(line.price||PRICE)));
   lines.push("");
   return;
  }
  bn++;
  lines.push(t().mailLineQty(bn,line.qty,line.wrist));
  line.beads.forEach((b,bi)=>lines.push(`  ${bi+1}. ${b.size==="rocaille"?t().rocailleWord:t().seedWord} – ${nameOf(b.key)}`));
  lines.push(t().mailSub(line.qty*(line.price||PRICE)));
  lines.push("");
 });
 lines.push(t().mailTotal(cartTotal()));
 lines.push("");
 lines.push(t().mailName(name));
 lines.push(t().mailEmail(email));
 lines.push(t().mailAddr(addr));
 return lines.join("\n");
}
function mailtoFallback(body){
 location.href="mailto:"+SHOP_EMAIL+"?subject="+encodeURIComponent(t().mailSubject)+"&body="+encodeURIComponent(body);
}
function orderSucceeded(orderNo){
 CART.length=0;
 renderCart();
 $("custName").value="";$("custEmail").value="";$("custAddr").value="";checkValid();
 $("thankYouMsg").textContent=t().thankYou;
 $("orderNoMsg").textContent=t().orderNoLbl+" "+orderNo;
 $("checkoutForm").style.display="none";
 $("checkoutSuccess").style.display="block";
}
$("confirmOrderBtn").onclick=async()=>{
 const name=$("custName").value.trim(), email=$("custEmail").value.trim(), addr=$("custAddr").value.trim();
 if(!name||!addr||!EMAIL_RE.test(email)){alert(t().fillBoth);return;}
 const orderNo=makeOrderNo();
 const body=buildOrderText(name,email,addr,orderNo);
 const mailParams=buildEmailJsParams(orderNo,name,email);
 $("confirmOrderBtn").disabled=true;
 $("confirmOrderBtn").textContent=t().sending;
 $("checkoutError").style.display="none";
 try{
  const res=await fetch(FORMSPREE_ENDPOINT,{
   method:"POST",
   headers:{"Accept":"application/json","Content-Type":"application/json"},
   body:JSON.stringify({name,email,address:addr,order_number:orderNo,message:body,_subject:t().mailSubject+" "+orderNo})
  });
  if(res.ok){await sendCustomerConfirmation(mailParams);orderSucceeded(orderNo);}
  else{
   let detail=String(res.status);
   try{const j=await res.json();if(j&&j.errors)detail=j.errors.map(e=>e.message||e.field||JSON.stringify(e)).join(", ");else if(j&&j.error)detail=j.error;}catch(_){}
   throw new Error(detail);
  }
 }catch(err){
  $("checkoutError").textContent=t().sendError+(err&&err.message?" ["+err.message+"]":"");
  $("checkoutError").style.display="block";
  mailtoFallback(body);
 }finally{
  $("confirmOrderBtn").disabled=false;
  $("confirmOrderBtn").textContent=t().confirmOrderBtn;
 }

function addProduct(id,wrist,btn){
 const p=prodById(id);if(!p)return;
 const ex=CART.find(l=>l.product===id&&l.wrist===wrist);
 if(ex)ex.qty++;else CART.push({product:id,price:p.price,wrist,qty:1});
 renderCart();
 if(btn){btn.classList.add("done");btn.innerHTML=ICON_OK;setTimeout(()=>{btn.classList.remove("done");btn.innerHTML=ICON_ADD;},1300);}
 showToast();
}

function persist(){
 try{localStorage.setItem("hb_state",JSON.stringify({
  wrist:S.wrist,
  draft:S.beads.map(b=>[b.size,b.key]),
  cart:CART.map(l=>l.product?{qty:l.qty,product:l.product,wrist:l.wrist}:{qty:l.qty,wrist:l.wrist,beads:l.beads.map(b=>[b.size,b.key])})
 }))}catch(e){}
}
function hydrate(pairs){
 const out=[];
 (pairs||[]).forEach(([size,key])=>{
  const it=PAL[size]&&PAL[size].items.find(i=>i.key===key);
  if(it)out.push({size,key:it.key,h:it.h,fx:it.fx,img:it.img});
 });
 return out;
}
function loadState(){
 try{
  const raw=localStorage.getItem("hb_state");if(!raw)return;
  const st=JSON.parse(raw);
  if(typeof st.wrist==="number"&&st.wrist>=14&&st.wrist<=22)S.wrist=st.wrist;
  S.beads=hydrate(st.draft);
  (st.cart||[]).forEach(l=>{
   if(l.product){const p=prodById(l.product);if(p)CART.push({product:p.id,price:p.price,wrist:(typeof l.wrist==="number"?l.wrist:17),qty:Math.max(1,l.qty|0)});return;}
   const b=hydrate(l.beads);if(b.length)CART.push({beads:b,wrist:l.wrist,qty:Math.max(1,l.qty|0)});
  });
 }catch(e){}
}
loadState();
route();
applyLang();
